<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CineScope BI Enhanced</title><style>
:root{--bg:#070b16;--side:#080d19;--panel:#10182a;--panel2:#151f34;--line:#263552;--text:#f6f8ff;--muted:#96a6c2;--blue:#5b8cff;--purple:#8b5cf6;--cyan:#22d3ee;--green:#2dd4a7;--red:#ef476f;--amber:#f6c453;--shadow:0 18px 45px #0005}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 75% 0,#17213d 0,#070b16 38%);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}aside{position:fixed;inset:0 auto 0 0;width:250px;background:#080d19f5;border-right:1px solid var(--line);padding:24px 17px;display:flex;flex-direction:column;z-index:10}.brand{display:flex;gap:12px;align-items:center;padding:0 10px 24px}.logo{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),var(--blue));box-shadow:0 0 25px #7c5cff55;font-size:19px}.brand b{letter-spacing:2px}.brand small,.source small{display:block;color:var(--muted);margin-top:3px}nav{display:grid;gap:6px}nav button{background:transparent;color:var(--muted);border:0;border-radius:10px;padding:13px;text-align:left;cursor:pointer;font-weight:650;transition:.2s}nav button:hover,nav button.active{background:#19243a;color:#fff;box-shadow:inset 3px 0 var(--blue)}.source{margin-top:auto;border:1px solid var(--line);padding:13px;border-radius:12px;color:var(--muted);font-size:11px}.source strong{display:block;color:var(--green);margin:5px 0}main{margin-left:250px;padding:27px 34px 60px;max-width:1800px}header{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px}header small{color:var(--blue);letter-spacing:2px;font-weight:750}h1{margin:6px 0 0;font-size:28px}.status{color:var(--muted);border:1px solid var(--line);padding:10px 14px;border-radius:99px;white-space:nowrap}.status i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:8px}.filters,.config{display:flex;gap:10px;flex-wrap:wrap;padding:14px;background:#0e1626;border:1px solid var(--line);border-radius:14px;margin-bottom:18px}.filters input,.filters select,.config select,.config input{background:#080e1b;color:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;min-width:130px}.filters input[type=search]{min-width:220px}.btn,.filters button,.config button{border:0;border-radius:8px;background:var(--blue);color:#fff;padding:10px 14px;font-weight:750;cursor:pointer;transition:.18s}.btn:hover,.filters button:hover,.config button:hover{filter:brightness(1.15);transform:translateY(-1px)}.secondary{background:#202c43!important}.danger{background:#5a2434!important}.exports{margin-left:auto;display:flex;gap:6px}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:15px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:15px}.kpi,.panel{background:linear-gradient(145deg,#121b2e,#0c1322);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.kpi{padding:19px;min-height:128px;cursor:pointer;position:relative;overflow:hidden;transition:.2s}.kpi:after{content:'Explore →';position:absolute;right:16px;bottom:12px;color:#8ea8de;font-size:11px;opacity:0;transform:translateY(4px);transition:.2s}.kpi:hover{border-color:#5577bc;transform:translateY(-3px)}.kpi:hover:after{opacity:1;transform:none}.kpi label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}.kpi strong{display:block;font-size:25px;margin:12px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi small{color:var(--muted)}.panel{grid-column:span 6;padding:20px;min-width:0;overflow:hidden}.panel.wide{grid-column:1/-1}.panel.third{grid-column:span 4}.panel h2{font-size:16px;line-height:1.35;margin:0 0 5px}.sub{color:var(--muted);line-height:1.5;margin:0 0 15px}.chart-shell{position:relative;width:100%;min-height:360px;overflow:hidden}.chart-shell canvas{display:block;width:100%;height:360px}.chart-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;color:var(--muted);font-size:12px}.chart-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}.tooltip{position:fixed;z-index:99;pointer-events:none;background:#050912f2;color:#fff;border:1px solid #3b4e73;border-radius:8px;padding:9px 11px;box-shadow:var(--shadow);font-size:12px;max-width:260px;line-height:1.45}.hidden{display:none!important}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:11px;text-transform:uppercase;position:sticky;top:0;background:#10182a}tbody tr:hover{background:#ffffff06}.scroll{overflow:auto;max-height:520px}.badge{display:inline-block;padding:5px 8px;background:#202d48;border-radius:99px;color:#c4d3ef;margin:2px;font-size:11px}.insight,.metric,.empty,.notice{background:#172238;border-left:3px solid var(--purple);padding:14px;margin:9px 0;border-radius:8px;line-height:1.55}.notice{border-color:var(--amber);color:#f8d66d}.metric code{display:block;color:#a7cbff;background:#08101f;padding:10px;margin:8px 0;border-radius:6px}.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:40;padding:20px}.modal-card{width:min(1280px,97vw);max-height:94vh;overflow:auto;background:#0d1628;border:1px solid var(--line);border-radius:17px;padding:24px;position:relative}.close{position:absolute;right:16px;top:12px;background:none;border:0;color:#fff;font-size:28px;cursor:pointer}.analysis-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;padding-right:38px}.analysis-head h2{font-size:24px;margin:0 0 6px}.analysis-actions{display:flex;gap:7px;flex-wrap:wrap}.drill{color:#9fb7e8;font-size:12px;margin-top:12px}.upload{display:grid;place-items:center;min-height:70vh;text-align:center}.upload-box{max-width:680px;padding:32px;background:#10182a;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.upload-box input{margin:18px 0}.error{color:#ff9bb2}body.focus aside,body.focus>main{filter:blur(2px)}@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.panel,.panel.third{grid-column:1/-1}.chart-shell{min-height:330px}.chart-shell canvas{height:330px}}@media(max-width:720px){aside{position:static;width:auto;height:auto}.source{display:none}nav{grid-template-columns:repeat(2,1fr)}main{margin:0;padding:18px}.kpis{grid-template-columns:1fr}header{align-items:flex-start}.status{display:none}.exports{margin-left:0;width:100%}.panel{padding:14px}.modal{padding:6px}.modal-card{padding:18px 12px}.analysis-head{display:block}.chart-shell{min-height:300px}.chart-shell canvas{height:300px}.config>*{flex:1 1 140px}}@media print{aside,#filters,.status,.btn,.config,.close,.analysis-actions{display:none!important}main{margin:0;padding:0}.panel,.kpi{box-shadow:none;background:#fff;color:#000;border-color:#ddd}body{background:#fff;color:#000}.modal{position:static;background:#fff;padding:0}.modal-card{max-height:none;width:100%;border:0}.grid{display:block}.panel{margin:10px 0}}
</style></head><body><aside><div class="brand"><div class="logo">◉</div><div><b>CINESCOPE</b><small>Movie Intelligence</small></div></div><nav id="nav"></nav><div class="source">MOVIELENS ANALYTICS<strong id="sourceInfo">Waiting for dataset</strong><small>Standalone BI edition</small></div></aside><main><header><div><small>BUSINESS INTELLIGENCE PLATFORM</small><h1 id="pageTitle">Overview Dashboard</h1></div><div class="status"><i></i><span id="statusText">Load the CSV dataset</span></div></header><section id="app"></section></main><div id="tooltip" class="tooltip hidden"></div><div id="modal" class="modal hidden"><div class="modal-card"><button class="close" onclick="closeModal()" aria-label="Close">×</button><div id="modalBody"></div></div></div><script>
'use strict';
const PAGES=[['overview','⌂','Overview Dashboard'],['movies','◫','Movie Explorer'],['genres','◇','Genre Intelligence'],['quality','✓','Data Quality'],['metrics','≡','Metric Definitions']];
const COLORS=['#8b5cf6','#5b8cff','#22d3ee','#2dd4a7','#f6c453','#ef476f','#a78bfa','#38bdf8','#34d399','#fb7185'];
let rows=[], globalMean=0, threshold=0, allGenres=[]; const state={page:'overview',search:'',genre:'',ymin:'',ymax:'',rmin:'',rmax:'',sort:'ratingCount',order:'desc',pageNo:1,pageSize:20,activeKpi:null};
const $=s=>document.querySelector(s),fmt=n=>n==null?'N/A':new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(n),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseCSV(text){const out=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(v=>v!==''))out.push(row);row=[]}else cell+=c}if(cell||row.length){row.push(cell);out.push(row)}return out}
function loadFile(file){const r=new FileReader();r.onload=()=>{try{const a=parseCSV(r.result),h=a.shift().map(x=>x.trim().replace(/^\ufeff/,'')),ix=n=>h.indexOf(n);['movie_id','movie_title','release_year','genres','rating_count','average_rating'].forEach(n=>{if(ix(n)<0)throw Error('Missing required column: '+n)});rows=a.map(x=>({id:+x[ix('movie_id')],title:x[ix('movie_title')],year:x[ix('release_year')]?+x[ix('release_year')]:null,genres:(x[ix('genres')]||'Unknown').split('|'),ratingCount:+x[ix('rating_count')]||0,avg:x[ix('average_rating')]?+x[ix('average_rating')]:null,imdb:ix('imdb_id')>=0?x[ix('imdb_id')]:null,tmdb:ix('tmdb_id')>=0?x[ix('tmdb_id')]:null})).filter(x=>Number.isFinite(x.id));initData();render()}catch(e){$('#loadError').textContent=e.message}};r.readAsText(file)}
function initData(){const rated=rows.filter(x=>x.avg!=null),total=rows.reduce((s,x)=>s+x.ratingCount,0);globalMean=rated.reduce((s,x)=>s+x.avg*x.ratingCount,0)/(total||1);const v=rated.map(x=>x.ratingCount).sort((a,b)=>a-b);threshold=v[Math.floor(v.length*.9)]||0;allGenres=[...new Set(rows.flatMap(x=>x.genres))].sort();$('#statusText').textContent='Real dataset loaded locally';$('#sourceInfo').textContent=`${fmt(rows.length)} real movies`}
function weighted(x){return x.avg==null?null:(x.ratingCount/(x.ratingCount+threshold))*x.avg+(threshold/(x.ratingCount+threshold))*globalMean}
function filtered(){const q=state.search.toLowerCase().trim();return rows.filter(x=>(!q||x.title.toLowerCase().includes(q))&&(!state.genre||x.genres.includes(state.genre))&&(!state.ymin||x.year>=+state.ymin)&&(!state.ymax||x.year<=+state.ymax)&&(!state.rmin||x.avg>=+state.rmin)&&(!state.rmax||x.avg<=+state.rmax))}
function aggregate(list,dim,measure,agg='sum',group='none'){const m=new Map();const put=(k,x)=>{if(k==null||k==='')return;const key=String(k),o=m.get(key)||{key,count:0,sum:0,weight:0,min:Infinity,max:-Infinity};let val=measure==='movieCount'?1:measure==='ratingCount'?x.ratingCount:measure==='averageRating'?x.avg:measure==='weightedRating'?weighted(x):x.ratingCount;if(val==null||!Number.isFinite(val))return;o.count++;o.sum+=val;o.weight+=measure==='averageRating'?x.ratingCount:1;o.min=Math.min(o.min,val);o.max=Math.max(o.max,val);m.set(key,o)};list.forEach(x=>{let keys;if(dim==='year')keys=[x.year];else if(dim==='decade')keys=[x.year?Math.floor(x.year/10)*10+'s':null];else if(dim==='genre')keys=x.genres;else if(dim==='ratingBand')keys=[x.avg==null?null:(Math.round(x.avg*2)/2).toFixed(1)];else keys=[x.title];keys.forEach(k=>put(k,x))});let a=[...m.values()].map(o=>({label:o.key,value:agg==='count'?o.count:agg==='average'?o.sum/o.count:agg==='weightedAverage'?(measure==='averageRating'?o.sum/o.count:o.sum/o.count):agg==='min'?o.min:agg==='max'?o.max:o.sum}));if(dim==='year')a.sort((x,y)=>+x.label-+y.label);else if(dim==='ratingBand')a.sort((x,y)=>+x.label-+y.label);else a.sort((x,y)=>y.value-x.value);return a}
function filters(){return `<div class="filters"><input id="q" type="search" placeholder="Search movie title" value="${esc(state.search)}"><select id="g"><option value="">All genres</option>${allGenres.map(g=>`<option ${g===state.genre?'selected':''}>${esc(g)}</option>`).join('')}</select><input id="y1" type="number" placeholder="Year from" value="${state.ymin}"><input id="y2" type="number" placeholder="Year to" value="${state.ymax}"><input id="r1" type="number" min="0.5" max="5" step="0.5" placeholder="Rating min" value="${state.rmin}"><input id="r2" type="number" min="0.5" max="5" step="0.5" placeholder="Rating max" value="${state.rmax}"><button onclick="applyFilters()">Apply</button><button class="secondary" onclick="resetFilters()">Reset</button></div>`}
function applyFilters(){Object.assign(state,{search:$('#q').value,genre:$('#g').value,ymin:$('#y1').value,ymax:$('#y2').value,rmin:$('#r1').value,rmax:$('#r2').value,pageNo:1});render()}function resetFilters(){Object.assign(state,{search:'',genre:'',ymin:'',ymax:'',rmin:'',rmax:'',pageNo:1});render()}
function kpi(id,label,value,sub){return `<div class="kpi" tabindex="0" role="button" onclick="openKpi('${id}')" onkeydown="if(event.key==='Enter')openKpi('${id}')"><label>${label}</label><strong title="${esc(value)}">${esc(value)}</strong><small>${sub}</small></div>`}
function panel(title,body,cls=''){return `<article class="panel ${cls}"><h2>${title}</h2>${body}</article>`}
function overview(){const f=filtered(),rated=f.filter(x=>x.avg!=null),total=f.reduce((s,x)=>s+x.ratingCount,0),avg=rated.reduce((s,x)=>s+x.avg*x.ratingCount,0)/(total||1),popular=[...f].sort((a,b)=>b.ratingCount-a.ratingCount)[0],top=[...rated].filter(x=>x.ratingCount>=threshold).sort((a,b)=>weighted(b)-weighted(a))[0],years=aggregate(f,'year','movieCount','sum'),active=[...years].sort((a,b)=>b.value-a.value)[0];return `${filters()}<div class="kpis">${kpi('movies','Total Movies',fmt(f.length),'Click for production analytics')}${kpi('ratings','Total Ratings',fmt(total),'Click for volume analytics')}${kpi('average','Average Rating',avg.toFixed(3),'Volume-weighted portfolio mean')}${kpi('genres','Total Genres',fmt(new Set(f.flatMap(x=>x.genres)).size),'Click for genre intelligence')}${kpi('popular','Most Popular',popular?.title||'N/A','Highest rating volume')}${kpi('weighted','Highest Weighted',top?.title||'N/A','Bayesian ranking')}${kpi('year','Most Active Year',active?.label||'N/A','Most movie releases')}${kpi('mean','Global Mean',globalMean.toFixed(4),'All dataset ratings')}</div><div class="grid">${panel('Movies Released Over Time','<div id="mainChart" class="chart-shell"><canvas></canvas></div><div id="mainLegend" class="chart-legend"></div>')}${panel('Rating Distribution','<div id="ratingChart" class="chart-shell"><canvas></canvas></div>')}${panel('Business Intelligence Notes',`<div class="insight"><b>Interactive KPI layer</b><p>Open any KPI card to drill into the supporting data, change chart type and analytical dimensions, then export the chart or the aggregated values.</p></div><div class="insight"><b>Metric consistency</b><p>All views use the active filters and the same local MovieLens source. Missing fields are excluded from relevant calculations, never invented.</p></div>`,'wide')}</div>`}
function afterOverview(){drawChart($('#mainChart canvas'),aggregate(filtered(),'year','movieCount','sum'),{type:'area',xLabel:'Release year',yLabel:'Movie count'});drawChart($('#ratingChart canvas'),aggregate(filtered(),'ratingBand','movieCount','sum'),{type:'bar',xLabel:'Average rating band',yLabel:'Movies'})}
function movies(){const f=[...filtered()].sort((a,b)=>state.sort==='title'?a.title.localeCompare(b.title):(b[state.sort]??-1)-(a[state.sort]??-1)),start=(state.pageNo-1)*state.pageSize,items=f.slice(start,start+state.pageSize),pages=Math.max(1,Math.ceil(f.length/state.pageSize));return `${filters()}<div class="grid">${panel('Movie Explorer',`<p class="sub">${fmt(f.length)} matching records · page ${state.pageNo} of ${pages}</p><div class="scroll"><table><thead><tr><th>Movie</th><th>Year</th><th>Genres</th><th>Ratings</th><th>Average</th><th>Weighted</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.title)}</td><td>${x.year??'—'}</td><td>${x.genres.map(g=>`<span class="badge">${esc(g)}</span>`).join('')}</td><td>${fmt(x.ratingCount)}</td><td>${x.avg?.toFixed(3)??'N/A'}</td><td>${weighted(x)?.toFixed(3)??'N/A'}</td></tr>`).join('')}</tbody></table></div><div class="filters"><button class="secondary" ${state.pageNo===1?'disabled':''} onclick="state.pageNo--;render()">Previous</button><button ${state.pageNo>=pages?'disabled':''} onclick="state.pageNo++;render()">Next</button></div>`,'wide')}</div>`}
function genreStats(list=filtered()){return aggregate(list,'genre','movieCount','sum')}function genres(){return `<div class="grid">${panel('Genre Distribution','<div id="genreChart" class="chart-shell"><canvas></canvas></div>','wide')}${panel('Methodology','<div class="insight"><b>Multi-label reach</b><p>Each movie contributes once to each assigned genre. Genre totals therefore describe reach and do not reconcile to the unique movie count.</p></div>','wide')}</div>`}function afterGenres(){drawChart($('#genreChart canvas'),genreStats().slice(0,20),{type:'horizontalBar',xLabel:'Movies',yLabel:'Genre'})}
function quality(){const missYear=rows.filter(x=>x.year==null).length,missAvg=rows.filter(x=>x.avg==null).length,invalid=rows.filter(x=>x.avg!=null&&(x.avg<.5||x.avg>5)).length,score=(100*(1-(missYear+missAvg)/(rows.length*8))).toFixed(2);return `<div class="grid">${panel('Transparent Quality Score',`<h1 style="font-size:48px;color:var(--green)">${score}%</h1><p class="sub">100 × (1 − known missing cells ÷ expected cells)</p>`,'third')}${panel('Validation Results',`<table><tr><td>Total records</td><td>${fmt(rows.length)}</td></tr><tr><td>Missing release year</td><td>${fmt(missYear)}</td></tr><tr><td>Missing average rating</td><td>${fmt(missAvg)}</td></tr><tr><td>Invalid ratings</td><td>${fmt(invalid)}</td></tr><tr><td>Zero-rating movies</td><td>${fmt(rows.filter(x=>x.ratingCount===0).length)}</td></tr></table>`,'wide')}</div>`}
function metrics(){return `<div class="grid">${panel('Analytical Dictionary',`<div class="metric"><b>Average Rating</b><code>Σ(rating_count × average_rating) / Σ(rating_count)</code>Volume-weighted mean.</div><div class="metric"><b>Weighted Rating</b><code>(v/(v+m))×R + (m/(v+m))×C</code>C=${globalMean.toFixed(5)}, m=${fmt(threshold)} (90th percentile).</div><div class="metric"><b>Popularity</b><code>rating_count</code>Audience reach, not movie quality.</div><div class="metric"><b>Movie Count</b><code>COUNT(DISTINCT movie_id)</code>Unique movies under active filters.</div>`,'wide')}</div>`}
const KPI={movies:{title:'Total Movies',dim:'year',measure:'movieCount',agg:'sum',type:'area',note:'Production volume by release year'},ratings:{title:'Total Ratings',dim:'genre',measure:'ratingCount',agg:'sum',type:'horizontalBar',note:'Rating volume by genre'},average:{title:'Average Rating',dim:'year',measure:'averageRating',agg:'average',type:'line',note:'Average movie rating by release year'},genres:{title:'Total Genres',dim:'genre',measure:'movieCount',agg:'sum',type:'bar',note:'Movies per multi-label genre'},popular:{title:'Most Popular',dim:'movie',measure:'ratingCount',agg:'sum',type:'horizontalBar',note:'Movies ranked by rating volume'},weighted:{title:'Highest Weighted',dim:'movie',measure:'weightedRating',agg:'average',type:'horizontalBar',note:'Bayesian weighted movie ranking'},year:{title:'Most Active Year',dim:'year',measure:'movieCount',agg:'sum',type:'area',note:'Yearly movie production evolution'},mean:{title:'Global Mean',dim:'genre',measure:'averageRating',agg:'average',type:'radar',note:'Genre averages compared with the global rating mean'}};
function openKpi(id){state.activeKpi=id;const saved=JSON.parse(localStorage.getItem('cinescope-config-'+id)||'null'),c={...KPI[id],...(saved||{})};$('#modalBody').innerHTML=`<div class="analysis-head"><div><small>INTERACTIVE KPI ANALYSIS</small><h2>${c.title}</h2><p class="sub">${c.note}</p></div><div class="analysis-actions"><button class="btn secondary" onclick="saveConfig()">Save configuration</button><button class="btn secondary" onclick="restoreConfig()">Restore default</button><button class="btn" onclick="exportChartPNG()">Export PNG</button><button class="btn" onclick="exportAnalysisCSV()">Export CSV</button></div></div><div class="config"><select id="chartType"><option value="line">Line Chart</option><option value="bar">Bar Chart</option><option value="horizontalBar">Horizontal Bar</option><option value="area">Area Chart</option><option value="pie">Pie Chart</option><option value="donut">Donut Chart</option><option value="scatter">Scatter Plot</option><option value="histogram">Histogram</option><option value="stackedBar">Stacked Bar</option><option value="radar">Radar Chart</option></select><select id="xDim"><option value="year">Release Year</option><option value="decade">Decade</option><option value="genre">Genre</option><option value="ratingBand">Rating Band</option><option value="movie">Movie</option></select><select id="yMeasure"><option value="movieCount">Movie Count</option><option value="ratingCount">Rating Count</option><option value="averageRating">Average Rating</option><option value="weightedRating">Weighted Rating</option></select><select id="agg"><option value="sum">Sum</option><option value="count">Count</option><option value="average">Average</option><option value="min">Minimum</option><option value="max">Maximum</option></select><button onclick="updateKpiChart()">Update visualization</button></div><div class="grid"><article class="panel wide"><div id="kpiChart" class="chart-shell"><canvas></canvas></div><div id="kpiLegend" class="chart-legend"></div><p id="drillText" class="drill">Click a chart element to cross-filter the analysis.</p></article><article class="panel third"><h2>Statistical Indicators</h2><div id="stats"></div></article><article class="panel" style="grid-column:span 9"><h2>Analytical Evidence</h2><div id="evidence" class="scroll"></div></article></div>`;$('#modal').classList.remove('hidden');$('#chartType').value=c.type;$('#xDim').value=c.dim;$('#yMeasure').value=c.measure;$('#agg').value=c.agg;updateKpiChart()}
function currentConfig(){return{type:$('#chartType').value,dim:$('#xDim').value,measure:$('#yMeasure').value,agg:$('#agg').value}}function updateKpiChart(){const c=currentConfig(),limit=c.dim==='movie'?25:c.dim==='genre'?20:80,data=aggregate(filtered(),c.dim,c.measure,c.agg).slice(0,limit);drawChart($('#kpiChart canvas'),data,{type:c.type,xLabel:$('#xDim').selectedOptions[0].text,yLabel:$('#yMeasure').selectedOptions[0].text,onClick:d=>drill(d,c)});const vals=data.map(x=>x.value).filter(Number.isFinite),mean=vals.reduce((a,b)=>a+b,0)/(vals.length||1),min=vals.length?Math.min(...vals):0,max=vals.length?Math.max(...vals):0;$('#stats').innerHTML=`<div class="metric"><b>Data points</b><code>${fmt(vals.length)}</code></div><div class="metric"><b>Mean</b><code>${fmt(mean)}</code></div><div class="metric"><b>Minimum</b><code>${fmt(min)}</code></div><div class="metric"><b>Maximum</b><code>${fmt(max)}</code></div>`;$('#evidence').innerHTML=`<table><thead><tr><th>${esc($('#xDim').selectedOptions[0].text)}</th><th>${esc($('#yMeasure').selectedOptions[0].text)}</th></tr></thead><tbody>${data.map(x=>`<tr><td>${esc(x.label)}</td><td>${fmt(x.value)}</td></tr>`).join('')}</tbody></table>`;window.currentAnalysis={data,c}}
function drill(d,c){if(c.dim==='genre')state.genre=d.label;else if(c.dim==='year'){state.ymin=d.label;state.ymax=d.label}else if(c.dim==='decade'){state.ymin=parseInt(d.label);state.ymax=parseInt(d.label)+9}else if(c.dim==='ratingBand'){state.rmin=+d.label-.24;state.rmax=+d.label+.24}else if(c.dim==='movie')state.search=d.label;$('#drillText').textContent=`Cross-filter applied: ${d.label}. Close this view to see the filtered dashboard.`;updateKpiChart()}
function saveConfig(){localStorage.setItem('cinescope-config-'+state.activeKpi,JSON.stringify(currentConfig()));toast('Configuration saved in this browser')}function restoreConfig(){localStorage.removeItem('cinescope-config-'+state.activeKpi);openKpi(state.activeKpi)}function closeModal(){$('#modal').classList.add('hidden');render()}
function drawChart(canvas,data,opt={}){const ctx=canvas.getContext('2d'),dpr=devicePixelRatio||1,w=canvas.clientWidth||900,h=canvas.clientHeight||360;canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);const type=opt.type||'bar',pad={l:type==='horizontalBar'?150:64,r:28,t:28,b:80};const plot={x:pad.l,y:pad.t,w:w-pad.l-pad.r,h:h-pad.t-pad.b};if(!data.length){ctx.fillStyle='#96a6c2';ctx.textAlign='center';ctx.fillText('No data for the current filters',w/2,h/2);return}const max=Math.max(...data.map(x=>x.value),0),min=Math.min(...data.map(x=>x.value),0),range=max-min||1;ctx.font='11px Segoe UI';ctx.strokeStyle='#263552';ctx.fillStyle='#96a6c2';ctx.lineWidth=1;const hit=[];function y(v){return plot.y+plot.h-(v-min)/range*plot.h}function short(s,n=14){return s.length>n?s.slice(0,n-1)+'…':s}
if(['pie','donut','radar'].includes(type)){const cx=plot.x+plot.w/2,cy=plot.y+plot.h/2,r=Math.min(plot.w,plot.h)*.37;if(type==='radar'){const a=data.slice(0,10),m=Math.max(...a.map(x=>x.value))||1;ctx.beginPath();a.forEach((x,i)=>{const ang=-Math.PI/2+i*2*Math.PI/a.length,px=cx+Math.cos(ang)*r,py=cy+Math.sin(ang)*r;ctx.moveTo(cx,cy);ctx.lineTo(px,py);ctx.fillStyle='#9caccc';ctx.textAlign=px<cx?'right':'left';ctx.fillText(short(x.label,18),px+(px<cx?-7:7),py)});ctx.strokeStyle='#344563';ctx.stroke();ctx.beginPath();a.forEach((x,i)=>{const ang=-Math.PI/2+i*2*Math.PI/a.length,rr=r*x.value/m,px=cx+Math.cos(ang)*rr,py=cy+Math.sin(ang)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py);hit.push({x:px-9,y:py-9,w:18,h:18,d:x})});ctx.closePath();ctx.fillStyle='#8b5cf655';ctx.fill();ctx.strokeStyle='#8b5cf6';ctx.lineWidth=2;ctx.stroke()}else{const a=data.slice(0,12),sum=a.reduce((s,x)=>s+Math.max(0,x.value),0)||1;let start=-Math.PI/2;a.forEach((x,i)=>{const ang=Math.max(0,x.value)/sum*2*Math.PI;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,start+ang);ctx.closePath();ctx.fillStyle=COLORS[i%COLORS.length];ctx.fill();hit.push({pie:true,cx,cy,r,start,end:start+ang,d:x});start+=ang});if(type==='donut'){ctx.beginPath();ctx.arc(cx,cy,r*.56,0,Math.PI*2);ctx.fillStyle='#10182a';ctx.fill()}const lg=$('#kpiLegend');if(lg)lg.innerHTML=a.map((x,i)=>`<span><i style="background:${COLORS[i%COLORS.length]}"></i>${esc(x.label)}: ${fmt(x.value)}</span>`).join('')}
}else if(type==='horizontalBar'){const a=data.slice(0,20),bh=plot.h/a.length*.65,gap=plot.h/a.length;a.forEach((x,i)=>{const yy=plot.y+i*gap+(gap-bh)/2,bw=(x.value-min)/range*plot.w;ctx.fillStyle=COLORS[i%COLORS.length];ctx.fillRect(plot.x,yy,Math.max(2,bw),bh);ctx.fillStyle='#c4d3ef';ctx.textAlign='right';ctx.fillText(short(x.label,22),plot.x-9,yy+bh*.7);ctx.textAlign='left';ctx.fillText(fmt(x.value),plot.x+Math.max(2,bw)+7,yy+bh*.7);hit.push({x:plot.x,y:yy,w:Math.max(2,bw),h:bh,d:x})})
}else{for(let i=0;i<=5;i++){const yy=plot.y+plot.h*i/5,v=max-range*i/5;ctx.strokeStyle='#263552';ctx.beginPath();ctx.moveTo(plot.x,yy);ctx.lineTo(plot.x+plot.w,yy);ctx.stroke();ctx.fillStyle='#96a6c2';ctx.textAlign='right';ctx.fillText(fmt(v),plot.x-8,yy+4)}const n=data.length,step=plot.w/Math.max(1,n),bw=Math.max(3,step*.62);if(['line','area','scatter'].includes(type)){ctx.beginPath();data.forEach((x,i)=>{const px=plot.x+step*(i+.5),py=y(x.value);i?ctx.lineTo(px,py):ctx.moveTo(px,py)});if(type==='area'){ctx.lineTo(plot.x+step*(n-.5),plot.y+plot.h);ctx.lineTo(plot.x+step*.5,plot.y+plot.h);ctx.closePath();ctx.fillStyle='#8b5cf633';ctx.fill()}ctx.strokeStyle='#8b5cf6';ctx.lineWidth=2.5;ctx.stroke();data.forEach((x,i)=>{const px=plot.x+step*(i+.5),py=y(x.value);ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fillStyle='#5b8cff';ctx.fill();hit.push({x:px-8,y:py-8,w:16,h:16,d:x})})}else data.forEach((x,i)=>{const px=plot.x+step*i+(step-bw)/2,py=y(x.value),hh=plot.y+plot.h-py;ctx.fillStyle=COLORS[i%COLORS.length];ctx.fillRect(px,py,bw,Math.max(2,hh));hit.push({x:px,y:py,w:bw,h:Math.max(2,hh),d:x})});const every=Math.max(1,Math.ceil(n/12));data.forEach((x,i)=>{if(i%every)return;const px=plot.x+step*(i+.5);ctx.save();ctx.translate(px,plot.y+plot.h+12);ctx.rotate(-Math.PI/4);ctx.fillStyle='#96a6c2';ctx.textAlign='right';ctx.fillText(short(x.label,18),0,0);ctx.restore()})}canvas._hit=hit;canvas._onClick=opt.onClick;canvas.onmousemove=e=>chartMove(e,canvas);canvas.onclick=e=>{const p=point(e,canvas),h=hit.find(z=>inside(p,z));if(h&&opt.onClick)opt.onClick(h.d)};new ResizeObserver(()=>{if(canvas.clientWidth!==w)setTimeout(()=>drawChart(canvas,data,opt),80)}).observe(canvas)}
function point(e,c){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function inside(p,h){if(h.pie){const dx=p.x-h.cx,dy=p.y-h.cy,a=Math.atan2(dy,dx),aa=a<h.start?a+Math.PI*2:a;return Math.hypot(dx,dy)<=h.r&&aa>=h.start&&aa<=h.end}return p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h}function chartMove(e,c){const p=point(e,c),h=(c._hit||[]).find(z=>inside(p,z)),t=$('#tooltip');if(!h){t.classList.add('hidden');c.style.cursor='default';return}t.innerHTML=`<b>${esc(h.d.label)}</b><br>${fmt(h.d.value)}`;t.style.left=Math.min(innerWidth-280,e.clientX+14)+'px';t.style.top=Math.min(innerHeight-80,e.clientY+14)+'px';t.classList.remove('hidden');c.style.cursor='pointer'}
function exportChartPNG(){const c=$('#kpiChart canvas'),a=document.createElement('a');a.download='cinescope-'+state.activeKpi+'.png';a.href=c.toDataURL('image/png');a.click()}function exportAnalysisCSV(){const a=window.currentAnalysis?.data||[],csv='dimension,value\n'+a.map(x=>`"${String(x.label).replaceAll('"','""')}",${x.value}`).join('\n');download('cinescope-analysis.csv','text/csv;charset=utf-8','\ufeff'+csv)}function download(name,type,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function toast(s){$('#statusText').textContent=s;setTimeout(()=>$('#statusText').textContent='Real dataset loaded locally',1800)}
function setPage(p){state.page=p;render()}function render(){if(!rows.length){$('#nav').innerHTML=PAGES.map(x=>`<button disabled>${x[1]} &nbsp; ${x[2]}</button>`).join('');$('#app').innerHTML=`<div class="upload"><div class="upload-box"><div class="logo" style="margin:auto">◉</div><h1>Load the CineScope dataset</h1><p class="sub">Select <b>CineScope_Filtered_Movies.csv</b>. The file stays on this computer and all BI calculations run locally in the browser.</p><input type="file" accept=".csv,text/csv" onchange="if(this.files[0])loadFile(this.files[0])"><p id="loadError" class="error"></p><div class="notice">Required columns: movie_id, movie_title, release_year, genres, rating_count, average_rating.</div></div></div>`;return}const p=PAGES.find(x=>x[0]===state.page);$('#pageTitle').textContent=p[2];$('#nav').innerHTML=PAGES.map(x=>`<button class="${x[0]===state.page?'active':''}" onclick="setPage('${x[0]}')">${x[1]} &nbsp; ${x[2]}</button>`).join('');$('#app').innerHTML=({overview,movies,genres,quality,metrics}[state.page])();requestAnimationFrame(()=>{if(state.page==='overview')afterOverview();if(state.page==='genres')afterGenres()})}render();
</script></body></html>
